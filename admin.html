<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Paneli | BAT ESPORTS</title><style>*{box-sizing:border-box}body{margin:0;background:#09090a;color:#f5f5f6;font:14px/1.6 system-ui,sans-serif}.top{position:sticky;top:0;background:#0c0c0df2;border-bottom:1px solid #303034;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;z-index:5}.logo{font-weight:1000;letter-spacing:.1em}.logo span{color:#ed1c24}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn{padding:10px 13px;border:1px solid #414146;border-radius:4px;background:#1a1a1d;color:white;font-weight:850;cursor:pointer;font:inherit;font-size:12px}button.red{background:#ed1c24;border-color:#ed1c24}button.danger{background:#250c0d;border-color:#66252a;color:#ff8589}.wrap{max-width:1160px;margin:auto;padding:25px 18px 85px}.eyebrow{color:#ff6369;letter-spacing:.2em;font-size:10px;font-weight:950}h1{font-size:34px;line-height:1.1;letter-spacing:-.04em;margin:7px 0}p{color:#aaa;margin:0}.notice{margin:20px 0;padding:12px 14px;background:#1b1011;border:1px solid #4b292c;color:#d4d4d7;border-radius:5px;font-size:12px}.tabs{display:flex;gap:6px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap}.tabs button.active{border-color:#ed1c24;background:#ed1c241d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;padding:16px;border:1px solid #343438;border-radius:6px;background:#131315}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.cardhead b{font-size:15px}.field{margin:11px 0}.field label{display:block;font-size:10px;letter-spacing:.07em;font-weight:900;color:#c8c8cd;margin-bottom:5px;text-transform:uppercase}.field input,.field textarea{width:100%;min-width:0;background:#080809;border:1px solid #38383d;padding:10px;color:white;border-radius:4px;font:inherit;font-size:13px}.field textarea{resize:vertical;min-height:75px}.field input:focus,.field textarea:focus{outline:none;border-color:#ed1c24}.pic{max-width:100px;max-height:80px;object-fit:contain;display:block;margin-top:8px}.hint{font-size:11px;color:#999;margin-top:4px}.status{align-self:center;font-size:12px;color:#8ce3ae}.empty{grid-column:1/-1;padding:35px;text-align:center;border:1px dashed #45454a;color:#aaa}.app p{margin:7px 0;overflow-wrap:anywhere;color:#ddd;font-size:12px}.app span{color:#999}.savebar{position:fixed;bottom:0;left:0;right:0;background:#09090af2;border-top:1px solid #303034;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:4;backdrop-filter:blur(12px)}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 12px 85px}.top{padding:10px 12px}h1{font-size:29px}}</style></head><body><header class="top"><a class="logo" href="/">BAT <span>ESPORTS</span> / ADMIN</a><div class="actions"><a class="btn" href="/">Siteyi Gör ↗</a><button id="logout">Çıkış</button></div></header><main class="wrap"><div class="eyebrow">YETKİLİ ALAN</div><h1>Site Yönetimi</h1><p>Metinleri, kadroyu, ekip bilgilerini, duyuruları, başarıları, mağazayı ve başvuruları yönet.</p><div class="notice">Düzenlemeler hemen yayımlanmaz. Değişiklikler için alttaki <b>Kaydet ve Yayınla</b> düğmesine bas. Görseller yüklemeden önce küçültülür.</div><nav class="tabs" id="tabs"><button data-tab="settings" class="active">Genel Ayarlar</button><button data-tab="roster">PUBG Kadrosu</button><button data-tab="staff">Yönetim & Ekip</button><button data-tab="news">Duyurular</button><button data-tab="achievements">Başarılar</button><button data-tab="store">Mağaza</button><button data-tab="applications">Başvurular</button></nav><div class="tools" id="tools"><button id="add" class="red">+ Yeni kayıt</button><button id="reload">Yeniden yükle</button></div><div id="area" class="grid"></div></main><div class="savebar"><span id="status" class="status"></span><button id="save" class="red">KAYDET VE YAYINLA ↗</button></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const def={settings:{title:'BORN IN DARKNESS. BUILT TO RULE.',description:'Sadece oyuna girmiyoruz. Bir iz bırakmak için sahnedeyiz. BAT Esports — disiplin, takım ruhu ve rekabet tutkusu.'},socials:{instagram:'',tiktok:'',youtube:'',discord:''},roster:[],staff:[],news:[],achievements:[],store:[]};const schema={roster:['name:Oyuncu adı','role:Rol / Pozisyon','description:Açıklama','social:Profil bağlantısı','image:Görsel'],staff:['name:Ad / Kullanıcı adı','role:Görev','description:Açıklama','social:Sosyal medya bağlantısı','image:Görsel'],news:['title:Başlık','date:Tarih / Kategori','description:Açıklama','link:Detay bağlantısı','image:Görsel'],achievements:['title:Başlık / Derece','event:Turnuva','year:Yıl','description:Açıklama'],store:['name:Ürün adı','category:Kategori','price:Fiyat metni','description:Açıklama','link:Ürün bağlantısı','image:Görsel']};let data=structuredClone(def),apps=[],tab='settings';function status(t,ok=true){$('#status').textContent=t;$('#status').style.color=ok?'#8ce3ae':'#ff7b80'}async function load(){status('Yükleniyor…');try{let m=await fetch('/api/me');if(!m.ok){location.replace('/login.html');return}let r=await fetch('/api/data');if(!r.ok)throw Error('Site verileri alınamadı');data={...structuredClone(def),...(await r.json())};if(!data.settings)data.settings={...def.settings};if(!data.socials)data.socials={};let ar=await fetch('/api/applications');if(ar.ok)apps=(await ar.json()).applications||[];render();status('Veriler hazır.')}catch(e){status(e.message,false)}}function field(index,key,label,val){let id='f'+index+key;if(key==='image')return '<div class="field"><label>'+esc(label)+'</label><input data-field="'+key+'" data-index="'+index+'" value="'+esc(val)+'" placeholder="Görsel URL veya dosya yükle"><input type="file" data-upload="'+index+'" accept="image/*"><div class="hint">Dosya seçersen otomatik küçültülür.</div>'+(val?'<img class="pic" src="'+esc(val)+'" alt="Önizleme">':'')+'</div>';return '<div class="field"><label for="'+id+'">'+esc(label)+'</label>'+(['description'].includes(key)?'<textarea id="'+id+'" data-field="'+key+'" data-index="'+index+'">'+esc(val)+'</textarea>':'<input id="'+id+'" data-field="'+key+'" data-index="'+index+'" value="'+esc(val)+'">')+'</div>'}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#tools').style.display=tab==='applications'?'none':'flex';$('#save').style.display=tab==='applications'?'none':'inline-block';if(tab==='settings'){let a=[['settings','Ana sayfa metinleri',{title:'Başlık',description:'Açıklama'}],['socials','Sosyal medya URL alanları',{instagram:'Instagram URL',tiktok:'TikTok URL',youtube:'YouTube URL',discord:'Discord davet URL'}]];$('#area').innerHTML=a.map(([key,title,fields])=>'<div class="card"><div class="cardhead"><b>'+title+'</b></div>'+Object.entries(fields).map(([k,l])=>'<div class="field"><label>'+l+'</label>'+(k==='description'?'<textarea data-settings="'+key+'" data-field="'+k+'">'+esc(data[key]?.[k]||'')+'</textarea>':'<input data-settings="'+key+'" data-field="'+k+'" value="'+esc(data[key]?.[k]||'')+'">')+'</div>').join('')+'</div>').join('');return}if(tab==='applications'){if(!apps.length){$('#area').innerHTML='<div class="empty">Henüz başvuru yok.</div>';return}$('#area').innerHTML=apps.slice().reverse().map(a=>'<article class="card app"><div class="cardhead"><b>'+esc(a.name)+'</b><button class="danger" data-appdel="'+esc(a.id)+'">Sil</button></div><p><span>Tarih:</span> '+esc(a.createdAt||'')+'</p><p><span>Yaş:</span> '+esc(a.age)+' &nbsp; <span>Rol:</span> '+esc(a.role)+'</p><p><span>Oyun ID:</span> '+esc(a.gameId||'—')+'</p><p><span>İletişim:</span> '+esc(a.contact)+'</p><p><span>Hakkında:</span> '+esc(a.about)+'</p></article>').join('');return}let list=data[tab]||[];if(!list.length){$('#area').innerHTML='<div class="empty">Henüz kayıt yok. <b>+ Yeni kayıt</b> düğmesine bas.</div>';return}$('#area').innerHTML=list.map((it,i)=>'<article class="card"><div class="cardhead"><b>'+esc(it.name||it.title||('Kayıt '+(i+1)))+'</b><button class="danger" data-del="'+i+'">Sil</button></div>'+schema[tab].map(f=>{let z=f.indexOf(':'),k=f.slice(0,z),l=f.slice(z+1);return field(i,k,l,it[k]||'')}).join('')+'</article>').join('')}$('#tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('#add').onclick=()=>{if(tab==='settings'||tab==='applications')return;let obj={};schema[tab].forEach(f=>obj[f.split(':')[0]]='');if(tab==='news')obj.date=new Date().toISOString().slice(0,10);if(tab==='achievements')obj.year=String(new Date().getFullYear());data[tab].push(obj);render()};$('#area').addEventListener('input',e=>{let el=e.target;if(el.dataset.settings){data[el.dataset.settings][el.dataset.field]=el.value}else if(el.dataset.index!==undefined&&el.dataset.field){data[tab][Number(el.dataset.index)][el.dataset.field]=el.value}});$('#area').addEventListener('change',async e=>{let el=e.target;if(el.type!=='file'||!el.files?.[0])return;try{let im=await createImageBitmap(el.files[0]),s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let uri=c.toDataURL('image/webp',.75),i=Number(el.dataset.upload);data[tab][i].image=uri;render();status('Görsel eklendi. Kaydetmeyi unutma.')}catch(e){status('Görsel okunamadı.',false)} });$('#area').addEventListener('click',async e=>{let d=e.target.closest('[data-del]');if(d&&confirm('Bu kaydı sil?')){data[tab].splice(Number(d.dataset.del),1);render();status('Kaydı kaldırdın; kalıcı olması için kaydet.')}let a=e.target.closest('[data-appdel]');if(a&&confirm('Başvuruyu kalıcı sil?')){try{let r=await fetch('/api/applications/'+encodeURIComponent(a.dataset.appdel),{method:'DELETE'});if(!r.ok)throw Error('Başvuru silinemedi');apps=apps.filter(v=>v.id!==a.dataset.appdel);render();status('Başvuru silindi.')}catch(x){status(x.message,false)}}});$('#save').onclick=async()=>{let b=$('#save');b.disabled=true;status('Kaydediliyor…');try{let r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Kaydedilemedi');status('Kaydedildi ve yayımlandı.')}catch(e){status(e.message,false)}finally{b.disabled=false}};$('#reload').onclick=load;$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'};load();
</script></body></html>
